<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-canvas" x1="640" y1="0" x2="640" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#080E1E" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="aurora-cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 180) scale(500 320)">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-indigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 120) scale(400 280)">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-emerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 220) scale(400 280)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Shield & Emblem Gradients -->
    <linearGradient id="shield-rim" x1="0" y1="0" x2="90" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="40%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="shield-core" x1="10" y1="10" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0F2744" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#063228" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="pulse-neon" x1="0" y1="0" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-gradient" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F0FDF4" />
      <stop offset="70%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glass Card Gradients -->
    <linearGradient id="glass-card-bg" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050B18" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="glass-card-border" x1="0" y1="0" x2="270" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.4" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.3" />
      <circle cx="48" cy="48" r="1.2" fill="#06B6D4" fill-opacity="0.3" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intense-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1280" height="520" rx="20" fill="url(#bg-canvas)" />
  <rect width="1280" height="520" rx="20" fill="url(#cyber-grid)" />

  <!-- Ambient Light Volumes -->
  <rect width="1280" height="520" fill="url(#aurora-cyan)" />
  <rect width="1280" height="520" fill="url(#aurora-indigo)" />
  <rect width="1280" height="520" fill="url(#aurora-emerald)" />

  <!-- Top Accent Neon Laser Border -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#pulse-neon)" />

  <!-- Outer Rounded Stroke -->
  <rect x="1" y="1" width="1278" height="518" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Background Decorative Cyber Pulse ECG Wave (Subtle Behind Elements) -->
  <path
    d="M 0 250 L 180 250 L 210 230 L 230 270 L 250 250 L 480 250 L 510 200 L 530 300 L 550 220 L 570 270 L 590 250 L 980 250 L 1010 215 L 1030 280 L 1050 250 L 1280 250"
    fill="none"
    stroke="#06B6D4"
    stroke-width="1.2"
    stroke-opacity="0.18"
    stroke-dasharray="6 4"
  />

  <!-- ==================== TOP BADGE ==================== -->
  <g transform="translate(640, 48)">
    <!-- Container pill -->
    <rect x="-240" y="0" width="480" height="34" rx="17" fill="#0B132B" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2" />
    <!-- Pulse dot -->
    <circle cx="-218" cy="17" r="5" fill="#22D3EE" filter="url(#neon-glow)" />
    <circle cx="-218" cy="17" r="2.5" fill="#FFFFFF" />
    <!-- Badge text -->
    <text x="0" y="22" fill="#E0F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      AdtU INNOVATION MELA 2026  •  SMALL BUSINESS CYBERSECURITY
    </text>
  </g>

  <!-- ==================== HERO SECTION (LOGO + TITLE) ==================== -->
  <g transform="translate(640, 160)">

    <!-- Center Left: Glowing Shield Emblem -->
    <g transform="translate(-390, -45)">
      <!-- Giant Back Glow -->
      <circle cx="55" cy="55" r="75" fill="#06B6D4" fill-opacity="0.2" filter="url(#intense-glow)" />

      <!-- Outer Shield Radar Rings -->
      <circle cx="55" cy="55" r="68" fill="none" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="8 6" />
      <circle cx="55" cy="55" r="58" fill="none" stroke="#818CF8" stroke-opacity="0.25" stroke-width="1" />

      <!-- Shield Body (Scaled from vector) -->
      <g transform="translate(10, 5) scale(1.42)">
        <!-- Base Shield -->
        <path
          d="M32 7L12 15.5V31C12 43.5 20.6 53.5 32 57C43.4 53.5 52 43.5 52 31V15.5L32 7Z"
          fill="url(#shield-core)"
          stroke="url(#shield-rim)"
          stroke-width="3"
          stroke-linejoin="round"
        />
        <!-- Inner Radar Arc -->
        <path
          d="M23 21C25.8 19 28.8 18 32 18C35.2 18 38.2 19 41 21"
          stroke="#818CF8"
          stroke-opacity="0.8"
          stroke-width="2"
          stroke-linecap="round"
        />
        <!-- SafePulse Neon Heartbeat Line -->
        <path
          d="M19 33.5H25L28.5 25L32.5 41L36 30L38.5 35H45"
          stroke="url(#pulse-neon)"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#neon-glow)"
        />
        <!-- Signal Nodes -->
        <circle cx="32" cy="13.5" r="2.2" fill="#22D3EE" />
        <circle cx="45" cy="35" r="2" fill="#34D399" />
      </g>
    </g>

    <!-- Main Title & Headlines (Left-aligned next to emblem) -->
    <g transform="translate(-250, -32)">
      <!-- Title -->
      <text x="0" y="42" fill="url(#title-gradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
        SafePulse <tspan fill="#22D3EE">AI</tspan>
      </text>

      <!-- Subtitle -->
      <text x="2" y="74" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">
        Affordable, AI-Powered Cybersecurity Platform for Small Businesses &amp; Retailers
      </text>

      <!-- Problem statement line with accent dots -->
      <g transform="translate(2, 98)">
        <text fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="13.5" font-weight="400">
          Built to detect <tspan fill="#67E8F9" font-weight="600">Phishing Attempts</tspan> • <tspan fill="#F87171" font-weight="600">Malware Payloads</tspan> • <tspan fill="#FBBF24" font-weight="600">Suspicious Scams</tspan> • <tspan fill="#34D399" font-weight="600">Data Breaches</tspan>
        </text>
      </g>
    </g>

    <!-- Top Right Quick Info Badges -->
    <g transform="translate(420, -25)">
      <!-- Bilingual Badge -->
      <rect x="0" y="0" width="180" height="32" rx="16" fill="#0E2442" stroke="#0284C7" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="90" y="20.5" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">
        🌐 English + বাংলা (Bilingual)
      </text>

      <!-- Zero Cost Badge -->
      <g transform="translate(0, 42)">
        <rect x="0" y="0" width="180" height="32" rx="16" fill="#06372B" stroke="#059669" stroke-opacity="0.6" stroke-width="1.2" />
        <text x="90" y="20.5" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">
          🔒 100% Local • Zero API Cost
        </text>
      </g>

      <!-- Cyber Helpline Badge -->
      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="180" height="32" rx="16" fill="#3D1217" stroke="#DC2626" stroke-opacity="0.6" stroke-width="1.2" />
        <text x="90" y="20.5" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">
          🚨 India Helpline: 1930
        </text>
      </g>
    </g>

  </g>

  <!-- ==================== 4 PILLARS GLASS CARDS ROW ==================== -->
  <g transform="translate(70, 290)">

    <!-- Pillar 1: Phishing Attempts -->
    <g transform="translate(0, 0)">
      <!-- Card Body -->
      <rect x="0" y="0" width="268" height="116" rx="14" fill="url(#glass-card-bg)" stroke="url(#glass-card-border)" stroke-width="1.4" />
      <rect x="1" y="1" width="266" height="3" rx="1.5" fill="#38BDF8" fill-opacity="0.7" />
      <!-- Icon Container -->
      <rect x="16" y="16" width="42" height="42" rx="10" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
      <text x="37" y="44" font-size="22" text-anchor="middle">🎣</text>
      <!-- Texts -->
      <text x="68" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800">Phishing Attempts</text>
      <text x="68" y="49" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">Dual-Layer NLP Classifier</text>
      <text x="16" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">
        Scans SMS &amp; WhatsApp fraud with inline urgency phrase highlighting.
      </text>
      <text x="16" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500">
        ✓ 0–100 Risk Banding  ✓ PDF Report
      </text>
    </g>

    <!-- Pillar 2: Malware Payloads -->
    <g transform="translate(290, 0)">
      <rect x="0" y="0" width="268" height="116" rx="14" fill="url(#glass-card-bg)" stroke="url(#glass-card-border)" stroke-width="1.4" />
      <rect x="1" y="1" width="266" height="3" rx="1.5" fill="#EF4444" fill-opacity="0.7" />
      <rect x="16" y="16" width="42" height="42" rx="10" fill="#DC2626" fill-opacity="0.2" stroke="#F87171" stroke-opacity="0.3" stroke-width="1" />
      <text x="37" y="44" font-size="22" text-anchor="middle">🦠</text>
      <text x="68" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800">Malware Payloads</text>
      <text x="68" y="49" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">APK &amp; EXE Payload Shield</text>
      <text x="16" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">
        Intercepts malicious drops targeting retail POS machines &amp; Android phones.
      </text>
      <text x="16" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500">
        ✓ Threat Playbooks  ✓ Quarantine Guide
      </text>
    </g>

    <!-- Pillar 3: Suspicious Activities -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="268" height="116" rx="14" fill="url(#glass-card-bg)" stroke="url(#glass-card-border)" stroke-width="1.4" />
      <rect x="1" y="1" width="266" height="3" rx="1.5" fill="#F59E0B" fill-opacity="0.7" />
      <rect x="16" y="16" width="42" height="42" rx="10" fill="#D97706" fill-opacity="0.2" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="1" />
      <text x="37" y="44" font-size="22" text-anchor="middle">⚠️</text>
      <text x="68" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800">Suspicious Activities</text>
      <text x="68" y="49" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">Brand Impersonation &amp; UPI</text>
      <text x="16" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">
        Exposes fake bank lookalikes, typosquatting, and suspicious QR code scams.
      </text>
      <text x="16" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500">
        ✓ SSRF Protection  ✓ Incident Workflow
      </text>
    </g>

    <!-- Pillar 4: Potential Data Breaches -->
    <g transform="translate(870, 0)">
      <rect x="0" y="0" width="270" height="116" rx="14" fill="url(#glass-card-bg)" stroke="url(#glass-card-border)" stroke-width="1.4" />
      <rect x="1" y="1" width="268" height="3" rx="1.5" fill="#10B981" fill-opacity="0.7" />
      <rect x="16" y="16" width="42" height="42" rx="10" fill="#059669" fill-opacity="0.2" stroke="#34D399" stroke-opacity="0.3" stroke-width="1" />
      <text x="37" y="44" font-size="22" text-anchor="middle">🛡️</text>
      <text x="68" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800">Data Breach Monitor</text>
      <text x="68" y="49" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">Credential Leak Radar</text>
      <text x="16" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">
        Checks business emails &amp; domains against dumps with exposed data tags.
      </text>
      <text x="16" y="98" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500">
        ✓ Passwords &amp; GSTIN  ✓ 1-Click PDF
      </text>
    </g>
  </g>

  <!-- ==================== BOTTOM TECH BAR ==================== -->
  <g transform="translate(70, 435)">
    <!-- Thin line separator -->
    <line x1="0" y1="0" x2="1140" y2="0" stroke="#1E293B" stroke-width="1.2" stroke-opacity="0.8" />

    <g transform="translate(0, 16)">
      <!-- Label -->
      <text x="0" y="18" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">
        TECH STACK:
      </text>

      <!-- Pills Container -->
      <g transform="translate(90, 0)">
        <!-- FastAPI -->
        <rect x="0" y="0" width="94" height="26" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
        <text x="47" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">⚡ FastAPI</text>

        <!-- Python -->
        <g transform="translate(104, 0)">
          <rect x="0" y="0" width="88" height="26" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
          <text x="44" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🐍 Python</text>
        </g>

        <!-- Scikit-Learn -->
        <g transform="translate(202, 0)">
          <rect x="0" y="0" width="115" height="26" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
          <text x="57" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🧠 Scikit-Learn</text>
        </g>

        <!-- React + Vite -->
        <g transform="translate(327, 0)">
          <rect x="0" y="0" width="115" height="26" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
          <text x="57" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">⚛️ React + Vite</text>
        </g>

        <!-- TypeScript -->
        <g transform="translate(452, 0)">
          <rect x="0" y="0" width="105" height="26" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
          <text x="52" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">📘 TypeScript</text>
        </g>

        <!-- Tailwind CSS -->
        <g transform="translate(567, 0)">
          <rect x="0" y="0" width="110" height="26" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
          <text x="55" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🎨 Tailwind CSS</text>
        </g>
      </g>

      <!-- Right Side Live Status Indicator -->
      <g transform="translate(980, 0)">
        <rect x="0" y="0" width="160" height="26" rx="6" fill="#062E25" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
        <circle cx="16" cy="13" r="4" fill="#34D399" filter="url(#neon-glow)" />
        <text x="26" y="17" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700">CERT-In MSME Aligned</text>
      </g>
    </g>
  </g>
</svg>
